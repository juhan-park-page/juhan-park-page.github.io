<!DOCTYPE html>
<html lang="en-US">

<head>
  <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">

  <meta content="width=device-width, initial-scale=1" name="viewport">
  <title>NVIDIA V2D Challenge — Juhan Park</title>

  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/fontawesome.all.min.css" rel="stylesheet">
  <link href="css/bulma.min.css" rel="stylesheet">
  <link href="css/index.css" rel="stylesheet">
  <link href="css/gallery.css" rel="stylesheet">

  <script defer src="js/fontawesome.all.min.js"></script>

<body>

  <section class="section">
    <div class="container is-max-desktop">

      <a class="gallery-back" href="index.html">
        <span class="icon"><i class="fas fa-arrow-left"></i></span>
        <span>Juhan Park</span>
      </a>

      <h1 class="title is-3">NVIDIA Video-to-Data (V2D) Challenge</h1>
      <p class="gallery-subtitle">
        Team DDD — 2nd Place and the Industry Award in Track 3, End-to-End Egocentric Transfer.
        Announced at the
        <a href="https://nvidia-isaac.github.io/video_to_data/v2d_corl_tutorial/" target="_blank" rel="noopener noreferrer">CoRL 2026 tutorial</a>.
      </p>

      <div class="gallery-grid">

        <figure class="gallery-item" tabindex="0"
                data-full="images/v2d/web/v2d-03.jpg"
                data-caption="Team DDD in the challenge tee — TOP #2 TEAM.">
          <img src="images/v2d/web/v2d-03-thumb.jpg" loading="lazy"
               alt="Three members of Team DDD seated together, wearing NVIDIA Video to Data Challenge TOP #2 TEAM shirts.">
          <figcaption>Team DDD — TOP #2 TEAM</figcaption>
        </figure>

        <figure class="gallery-item" tabindex="0"
                data-full="images/v2d/web/v2d-04.jpg"
                data-caption="Celebrating the Track 3 result.">
          <img src="images/v2d/web/v2d-04-thumb.jpg" loading="lazy"
               alt="Team DDD celebrating with arms raised in front of a brick wall, wearing the challenge shirts.">
          <figcaption>Celebrating the result</figcaption>
        </figure>

        <figure class="gallery-item" tabindex="0"
                data-full="images/v2d/web/v2d-05.jpg"
                data-caption="At the CoRL venue, where the award was announced.">
          <img src="images/v2d/web/v2d-05-thumb.jpg" loading="lazy"
               alt="Four team members smiling at the CoRL conference venue, one wearing a CoRL lanyard.">
          <figcaption>At CoRL</figcaption>
        </figure>

        <figure class="gallery-item" tabindex="0"
                data-full="images/v2d/web/v2d-01.jpg"
                data-caption="Somewhere along the way.">
          <img src="images/v2d/web/v2d-01-thumb.jpg" loading="lazy"
               alt="Two team members at a diner table with burgers and drinks.">
          <figcaption>Along the way</figcaption>
        </figure>

        <figure class="gallery-item" tabindex="0"
                data-full="images/v2d/web/v2d-02.jpg"
                data-caption="The view from the room.">
          <img src="images/v2d/web/v2d-02-thumb.jpg" loading="lazy"
               alt="City skyline at dusk seen through a window, high-rise buildings lit up.">
          <figcaption>The view from the room</figcaption>
        </figure>

      </div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>

    <img class="lightbox-img" id="lightbox-img" alt="">
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next photo">&#8250;</button>
    <p class="lightbox-caption" id="lightbox-caption"></p>
